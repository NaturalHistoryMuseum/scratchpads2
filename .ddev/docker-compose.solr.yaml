# DDev Apache Solr recipe file for Solr 4.
#
# To access Solr after it is installed:
# - The Solr admin interface will be accessible at:
#   http://<projectname>.ddev.site:8983/solr/
#   For example, if the project is named "myproject" the hostname will be:
#   http://myproject.ddev.site:8983/solr/
# - To access the Solr container from the web container use:
#   http://solr:8983/solr/

version: '3.6'

services:
  solr:
    # Name of container using standard ddev convention.
    container_name: ddev-${DDEV_SITENAME}-solr
    # Grab an image from https://hub.docker.com/r/geerlingguy/solr since older
    # versions are not available on https://hub.docker.com/_/solr.
    build:
      context: ./solr
      dockerfile: Dockerfile
    image: scratchpads-solr:4.10.4-java8
    restart: "always"
    # Solr is served from this port inside the container.
    ports:
      - 8983
    # These labels ensure the service is discoverable by ddev.
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: $DDEV_APPROOT
    environment:
      # This defines the host name the service should be accessible from. This
      # will be sitename.ddev.site.
      - VIRTUAL_HOST=$DDEV_HOSTNAME
      # This defines the port the service should be accessible from at
      # sitename.ddev.site.
      - HTTP_EXPOSE=8983
    volumes:
      # Store the complete Solr home, including the collection1 index, in a
      # named volume so the index survives container recreation.
      - solr:/var/solr

      # Load the Scratchpads Solr 4 configuration for the collection1 core.
      - ./solr/conf:/var/solr/collection1/conf:ro

      # Disposable cores created by the live Drupal tests. This path is also
      # mounted into the web container because Solr CoreAdmin must be able to
      # read the configuration written by the PHP test process.
      - ./solr/test-cores:/var/solr-test-cores

      # This mounts the .ddev directory into the container so we can use it
      # if necessary.
      - ".:/mnt/ddev_config"

    # Initialize a newly-created named volume before starting Solr. Docker
    # mounts the volume over /var/solr, so files placed there by the image are
    # otherwise hidden on the first start of each DDEV project.
    command:
      - /bin/sh
      - -c
      - |
          set -eu
          if [ ! -f /var/solr/solr.xml ]; then
            cp /opt/solr/example/solr/solr.xml /var/solr/solr.xml
          fi
          if [ ! -f /var/solr/zoo.cfg ]; then
            cp /opt/solr/example/solr/zoo.cfg /var/solr/zoo.cfg
          fi
          mkdir -p /var/solr/collection1
          if [ ! -f /var/solr/collection1/core.properties ]; then
            printf 'name=collection1\n' > /var/solr/collection1/core.properties
          fi
          exec /opt/solr/bin/solr start -p 8983 -f -s /var/solr

    external_links:
      - "ddev-router:${DDEV_SITENAME}.${DDEV_TLD}"

  # This links the Solr service to the web service defined in the main
  # docker-compose.yml, allowing applications running inside the web container to
  # access the Solr service at http://solr:8983
  web:
    links:
      - solr:solr
    volumes:
      - ./solr/test-cores:/var/solr-test-cores
volumes:
  # solr is a persistent Docker volume for solr data
  # The persistent volume should have the same name as the service so it can be deleted
  # when the project is deleted.
  solr:
