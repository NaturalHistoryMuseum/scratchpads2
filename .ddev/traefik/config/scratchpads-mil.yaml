    scratchpads-mil-web-8025-http:
      
      rule: HostRegexp(`scratchpads-mil.ddev.site`)
      
      middlewares:
        - autodetect
      service: "scratchpads-mil-web-8025-http"
      tls: false
      entrypoints:
        - http-8025
    
    
    
    
    scratchpads-mil-solr-8983-http:
      
